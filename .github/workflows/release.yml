name: Development Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.2.3)'
        required: false
        default: 'nightly'

# 授予 GITHUB_TOKEN 创建 Release 和上传资产的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      id: setup-java
      with:
        java-version: '8'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        brew install ldid wget make
        sudo mkdir -p /usr/local/bin
        sudo ln -s /opt/homebrew/bin/gmake /usr/local/bin/gmake

    - name: Run Makefile
      run: |
        JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
        export PATH="$JDK_BASE_PATH/bin:$PATH"
        make clean JAVA_HOME="$JDK_BASE_PATH" BOOTJDK="$JDK_BASE_PATH/bin" || true
        make JAVA_HOME="$JDK_BASE_PATH" BOOTJDK="$JDK_BASE_PATH/bin"

    - name: Find Scheme and Build Xcode Project
      run: |
        JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
        SCHEME_NAME=$(xcodebuild -project Amethyst.xcodeproj -list | awk '/Schemes:/{flag=1;next} /^$/{flag=0} flag' | sed 's/^[[:space:]]*//' | head -n 1)
        echo "Detected Scheme Name: '$SCHEME_NAME'"
        if [ -z "$SCHEME_NAME" ]; then
          echo "Error: Could not automatically detect an Xcode scheme!"
          exit 1
        fi
        echo "TARGET_SCHEME=$SCHEME_NAME" >> $GITHUB_ENV
        xcodebuild -project Amethyst.xcodeproj \
                   -scheme "$SCHEME_NAME" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   DEBUG_INFORMATION_FORMAT=dwarf \
                   JAVA_HOME="$JDK_BASE_PATH" \
                   BOOTJDK="$JDK_BASE_PATH/bin" \
                   clean build

    - name: Package App into IPA
      run: |
        cd artifacts
        zip -r ../Amethyst.ipa Payload

    - name: Upload Finished IPA (as workflow artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Amethyst
        path: Amethyst.ipa

    # ========== 新增：发布到 GitHub Release ==========
    # 仅在手动触发（workflow_dispatch）且提供了 version 输入时执行
    - name: Create Release and upload assets
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ${{ github.event.inputs.version }}
        files: Amethyst.ipa
        fail_on_unmatched_files: true
        token: ${{ secrets.GITHUB_TOKEN }}